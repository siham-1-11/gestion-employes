<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Postes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar dyal l-Navigation w l-Authentification -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">DELFYO</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}">Tableau de bord</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/employes}">Employés</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/postes}">Postes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/departements}">Départements</a>
        </li>
      </ul>
      <!-- Bouton Logout (Déconnexion Spring Security) -->
      <form th:action="@{/logout}" method="post" class="d-flex ms-auto">
        <button class="btn btn-outline-danger btn-sm" type="submit">Déconnexion</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion des Postes</h2>
        <a th:href="@{/postes/ajouter}" class="btn btn-primary">+ Ajouter un poste</a>
    </div>

    <table class="table table-bordered table-striped shadow-sm bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Intitulé</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${postes}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.intitule}">Développeur Fullstack</td>
                <td th:text="${p.description}">Développement des applications Java / Spring</td>
                <td>
                    <a th:href="@{/postes/modifier/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Modifier</a>
                    <a th:href="@{/postes/supprimer/{id}(id=${p.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Confirmer la suppression?')">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
