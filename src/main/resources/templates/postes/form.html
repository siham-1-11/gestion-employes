<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Poste</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${poste.id == null ? 'Ajouter un poste' : 'Modifier le poste'}">Formulaire</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/postes/save}" th:object="${poste}" method="post">
                <input type="hidden" th:field="*{id}"/>
                
                <div class="mb-3">
                    <label class="form-label">Intitulé du poste</label>
                    <input type="text" th:field="*{intitule}" class="form-control" th:classappend="${#fields.hasErrors('intitule')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{intitule}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">Enregistrer</button>
                <a th:href="@{/postes}" class="btn btn-secondary w-100 mt-2">Annuler</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
