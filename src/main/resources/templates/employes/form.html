<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Employé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <!-- تم التعديل هنا لتفادي مشكلة الرمز ' -->
            <h4 class="mb-0" th:text="${employe.id == null ? 'Ajouter un Employé' : 'Modifier Employé'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/employes/save}" th:object="${employe}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <!-- Nom -->
                <div class="mb-3">
                    <label class="form-label">Nom <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{nom}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <!-- Prénom -->
                <div class="mb-3">
                    <label class="form-label">Prénom <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{prenom}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!-- Téléphone -->
                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" th:field="*{telephone}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></div>
                </div>

                <!-- Département -->
                <div class="mb-3">
                    <label class="form-label">Département <span class="text-danger">*</span></label>
                    <select th:field="*{departement}" class="form-select" th:errorclass="is-invalid">
                        <option value="">-- Choisir un département --</option>
                        <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('departement')}" th:errors="*{departement}"></div>
                </div>

                <!-- Poste -->
                <div class="mb-3">
                    <label class="form-label">Poste <span class="text-danger">*</span></label>
                    <select th:field="*{poste}" class="form-select" th:errorclass="is-invalid">
                        <option value="">-- Choisir un poste --</option>
                        <option th:each="p : ${postes}" th:value="${p.id}" th:text="${p.intitule}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('poste')}" th:errors="*{poste}"></div>
                </div>

                <!-- Photo -->
                <div class="mb-3">
                    <label class="form-label">Photo de profil</label>
                    <input type="file" name="photoFile" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-success w-100">Enregistrer</button>
                <a th:href="@{/employes}" class="btn btn-secondary w-100 mt-2">Annuler</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
