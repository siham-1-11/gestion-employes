<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de l'Employé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow text-center p-4">
        <div>
            <img th:if="${employe.photo != null}" th:src="@{'/uploads/' + ${employe.photo}}" class="rounded-circle mb-3" width="120" height="120">
            <img th:if="${employe.photo == null}" src="https://via.placeholder.com/120" class="rounded-circle mb-3">
        </div>
        <h3 th:text="${employe.nom + ' ' + employe.prenom}"></h3>
        <p class="text-muted" th:text="${employe.email}"></p>
        <hr>
        <div class="text-start">
            <p><strong>Téléphone:</strong> <span th:text="${employe.telephone != null ? employe.telephone : 'N/A'}"></span></p>
            <p><strong>Département:</strong> <span th:text="${employe.departement != null ? employe.departement.nom : 'Non assigné'}"></span></p>
            <p><strong>Poste:</strong> <span th:text="${employe.poste != null ? employe.poste.intitule : 'Non assigné'}"></span></p>
        </div>
        <a th:href="@{/employes}" class="btn btn-primary mt-3">Retour à la liste</a>
    </div>
</div>

</body>
</html>
