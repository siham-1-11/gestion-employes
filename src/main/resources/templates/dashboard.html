<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord - DELFYO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">DELFYO</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}">Tableau de bord</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/employes}">Employés</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/postes}">Postes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/departements}">Départements</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/audit-logs}">
            <i class="bi bi-clock-history me-1"></i> Historique (Audit)
          </a>
        </li>
      </ul>
      <form th:action="@{/logout}" method="post" class="d-flex ms-auto">
        <button class="btn btn-outline-danger btn-sm" type="submit">Déconnexion</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
    <h2 class="mb-4">Tableau de bord</h2>

    <!-- Stat Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-uppercase fw-semibold">Total Employés</h6>
                        <h2 class="mb-0 fw-bold" th:text="${totalEmployes}">0</h2>
                    </div>
                    <i class="bi bi-people-fill fs-1"></i>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/employes}" class="text-white text-decoration-none small">Voir détails &rarr;</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-uppercase fw-semibold">Départements</h6>
                        <h2 class="mb-0 fw-bold" th:text="${totalDepartements}">0</h2>
                    </div>
                    <i class="bi bi-building fs-1"></i>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/departements}" class="text-white text-decoration-none small">Voir détails &rarr;</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning text-dark shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-uppercase fw-semibold">Postes</h6>
                        <h2 class="mb-0 fw-bold" th:text="${totalPostes}">0</h2>
                    </div>
                    <i class="bi bi-briefcase-fill fs-1"></i>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/postes}" class="text-dark text-decoration-none small">Voir détails &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Section Graphiques -->
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5 class="card-title text-center mb-3 fw-bold">Répartition par Département</h5>
                <canvas id="deptChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5 class="card-title text-center mb-3 fw-bold">Répartition par Poste</h5>
                <canvas id="posteChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Script Chart.js -->
<script th:inline="javascript">
    const deptLabels = /*[[${deptLabels}]]*/ [];
    const deptCounts = /*[[${deptCounts}]]*/ [];
    const posteLabels = /*[[${posteLabels}]]*/ [];
    const posteCounts = /*[[${posteCounts}]]*/ [];

    // Chart Départements (Doughnut)
    new Chart(document.getElementById('deptChart'), {
        type: 'doughnut',
        data: {
            labels: deptLabels,
            datasets: [{
                data: deptCounts,
                backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#0dcaf0', '#6c757d']
            }]
        }
    });

    // Chart Postes (Bar)
    new Chart(document.getElementById('posteChart'), {
        type: 'bar',
        data: {
            labels: posteLabels,
            datasets: [{
                label: 'Nombre d\'employés',
                data: posteCounts,
                backgroundColor: '#0d6efd'
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
</script>

</body>
</html>
