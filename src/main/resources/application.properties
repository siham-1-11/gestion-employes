spring.application.name=gestionEtudiant
spring.application.name=gestionEtudiant

# --- MySQL Configuration ---
# تأكد بلي MySQL خدام (XAMPP ولا Wamp) وبلي هاد البور 3306 هو اللي كاين
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_employes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf Configuration ---
spring.thymeleaf.cache=false
spring.security.user.name=admin
spring.security.user.password=admin123
server.port=8086
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always